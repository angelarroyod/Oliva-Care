name: demo

# Publishes the offline web demo (sample data, no backend; src/lib/demo.ts) to
# GitHub Pages. One-time setup: Settings → Pages → Source: GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Export web demo
        run: npx expo export -p web --output-dir dist
        env:
          EXPO_PUBLIC_DEMO: "1"
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      # GitHub Pages has no SPA rewrites: serve the app for every deep link.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
